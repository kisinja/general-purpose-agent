[project]
name = "agentic-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kisinja", email = "kisinjaelvis@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.5",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.10",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "streamlit",
    "tavily-python>=0.8.5",
]

[project.scripts]
agentic-ai = "agentic_ai:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
